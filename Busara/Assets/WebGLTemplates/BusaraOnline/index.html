<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Busara — Online MVP</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #090d13; color: #f0f2f7; }
    body { display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
    #unity-canvas { width: min(100vw, 160vh); height: min(100vh, 62.5vw); display: block; }
    #loading { position: absolute; padding: 1.5rem; background: #121923; max-width: 36rem; text-align: center; }
  </style>
  <script>
    // Capture/remove the invitation before downloading Unity or calling services.
    const route = new URLSearchParams(location.hash.slice(1));
    if (route.has('invite')) {
      window.__busaraInvite = route.get('invite');
      history.replaceState(null, '', location.pathname + location.search);
    }
  </script>
</head>
<body>
  <canvas id="unity-canvas" width="1600" height="1000" tabindex="0" aria-label="Busara Online MVP game"></canvas>
  <div id="loading" role="status">Loading the Unity board…</div>
  <script src="busara-config.js"></script>
  <script src="busara-ugs.js"></script>
  <script src="busara-latency.js"></script>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    const canvas = document.querySelector('#unity-canvas');
    const loading = document.querySelector('#loading');
    createUnityInstance(canvas, {
      dataUrl: 'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: 'Build/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      matchWebGLToCanvasSize: true
    }, progress => { loading.textContent = 'Loading the Unity board… ' + Math.round(progress * 100) + '%'; })
      .then(() => { loading.remove(); canvas.focus(); })
      .catch(() => { loading.textContent = 'The Unity Web player could not load. Check that the server hosts the complete Web build, then reload.'; });
  </script>
</body>
</html>
