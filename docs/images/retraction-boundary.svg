<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-labelledby="title desc">
  <title id="title">Retraction restores the action, not independent commitments or learned information</title>
  <desc id="desc">Capture an action snapshot, let the action resolve, and offer Retraction before the turn ends. Restore board resources, kingdom assignment and visibility rules, virtues, and deck state. Then reapply all independent reaction payments, including Retraction. Keep queued Time turns, public reveals and learned kingdom knowledge. Finish the original pending action exactly once.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
  <rect width="1080" height="470" rx="16" fill="#f8fafc"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#0f172a">
    <text x="30" y="40" font-size="24" font-weight="700">Retraction has a deliberate restoration boundary</text>
    <text x="30" y="69" font-size="15">Undo the completed action before its turn ends; do not erase independent reactions.</text>
    <g stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
      <path d="M263 124 H307"/><path d="M542 124 H587"/><path d="M822 124 H867"/>
    </g>
    <g stroke-width="2">
      <rect x="30" y="94" width="233" height="60" rx="9" fill="#dbeafe" stroke="#1d4ed8"/>
      <rect x="310" y="94" width="232" height="60" rx="9" fill="#ffffff" stroke="#64748b"/>
      <rect x="590" y="94" width="232" height="60" rx="9" fill="#ede9fe" stroke="#6d28d9"/>
      <rect x="870" y="94" width="180" height="60" rx="9" fill="#dcfce7" stroke="#15803d"/>
    </g>
    <g font-size="17" text-anchor="middle" font-weight="700">
      <text x="146" y="131">Capture snapshot</text><text x="426" y="131">Action resolves</text>
      <text x="706" y="131">Pay and retract</text><text x="960" y="131">Complete once</text>
    </g>
    <rect x="30" y="185" width="490" height="206" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <rect x="550" y="185" width="500" height="206" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="50" y="217" font-size="20" font-weight="700">Restore captured action state</text>
    <text x="570" y="217" font-size="20" font-weight="700">Keep independent consequences</text>
    <g font-size="17">
      <text x="50" y="252">Board resources and their positions</text>
      <text x="50" y="282">Kingdom assignments and hidden-virtue state</text>
      <text x="50" y="312">Virtue inventory, then reapply reaction costs</text>
      <text x="50" y="342">Deck order and count</text>
      <text x="50" y="372">Clear selections, draws and Magic extra actions</text>
      <text x="570" y="252">Retraction's own paid activation cost</text>
      <text x="570" y="282">Earlier independently paid reaction costs</text>
      <text x="570" y="312">Time turns that were independently queued</text>
      <text x="570" y="342">Publicly revealed kingdom information</text>
      <text x="570" y="372">Kingdom knowledge a player already learned</text>
    </g>
    <text x="30" y="425" font-size="16" font-weight="700">Legality checks actual ownership; the bot's valuation sees only permitted information.</text>
    <text x="30" y="450" font-size="14" fill="#475569">The snapshot is not a serialized copy of every scene object. UI callbacks and the pending completion are not replayed.</text>
  </g>
</svg>
