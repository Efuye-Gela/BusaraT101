<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
  <title id="title">Time queues extra turns and then resumes the original sequence</title>
  <desc id="desc">A is finishing its turn. The ordinary next player is B, but independent Time uses have queued C and then D. Save B as the resume player, execute queued turns in first-in first-out order C then D, then resume B. Do not calculate the resumed player from D's usual neighbor.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
  <rect width="1000" height="410" rx="16" fill="#f8fafc"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#0f172a">
    <text x="30" y="42" font-size="24" font-weight="700">Time: a FIFO queue plus one saved return point</text>
    <text x="30" y="70" font-size="15">Each accepted Time use pays its own cost and enqueues its caster through ScheduleTurn.</text>
    <rect x="30" y="98" width="940" height="57" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <text x="48" y="132" font-size="18">Before finishing A:</text>
    <text x="275" y="132" font-size="18" font-weight="700">sequential next = B</text>
    <text x="595" y="132" font-size="18" font-weight="700">extraTurns = [C, D]</text>
    <g stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
      <path d="M200 239 H277"/><path d="M450 239 H527"/><path d="M700 239 H777"/>
    </g>
    <g stroke-width="2">
      <rect x="30" y="190" width="170" height="98" rx="10" fill="#dbeafe" stroke="#1d4ed8"/>
      <rect x="280" y="190" width="170" height="98" rx="10" fill="#ede9fe" stroke="#6d28d9"/>
      <rect x="530" y="190" width="170" height="98" rx="10" fill="#ede9fe" stroke="#6d28d9"/>
      <rect x="780" y="190" width="190" height="98" rx="10" fill="#dcfce7" stroke="#15803d"/>
    </g>
    <g text-anchor="middle">
      <g font-size="24" font-weight="700">
        <text x="115" y="226">A finishes</text><text x="365" y="226">C</text>
        <text x="615" y="226">D</text><text x="875" y="226">B resumes</text>
      </g>
      <g font-size="15">
        <text x="115" y="258">Save resumePlayer B</text><text x="365" y="258">First queued turn</text>
        <text x="615" y="258">Second queued turn</text><text x="875" y="258">Clear saved return</text>
      </g>
    </g>
    <rect x="30" y="318" width="940" height="62" rx="10" fill="#fff7ed" stroke="#b45309"/>
    <text x="48" y="344" font-size="16" font-weight="700">Do not resume from D's sequential neighbor.</text>
    <text x="48" y="368" font-size="14">Time's independently queued turns survive Retraction. Magic instead grants actions inside the current turn.</text>
  </g>
</svg>
