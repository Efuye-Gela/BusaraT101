<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Best-effort resource addition when only two spaces remain</title>
  <desc id="desc">A simplified two by two board starts with Earth and Water, leaving two empty spaces. An add-three effect lets the affected player choose Fire and Air and their destinations. Two pieces are added; the final addition is skipped because the board is full. Existing resources stay in place.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
  <rect width="960" height="430" rx="16" fill="#f8fafc"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#0f172a">
    <text x="30" y="40" font-size="24" font-weight="700">Apply as much as possible; the affected player chooses</text>
    <text x="30" y="68" font-size="15">Illustrative 2 x 2 board, not the full game's board layout.</text>
    <text x="146" y="105" text-anchor="middle" font-size="18" font-weight="700">Before: two spaces free</text>
    <text x="814" y="105" text-anchor="middle" font-size="18" font-weight="700">After: board full</text>
    <g stroke="#64748b" stroke-width="2">
      <rect x="36" y="124" width="100" height="90" rx="8" fill="#dcfce7"/>
      <rect x="146" y="124" width="100" height="90" rx="8" fill="#dbeafe"/>
      <rect x="36" y="224" width="100" height="90" rx="8" fill="#ffffff" stroke-dasharray="6 4"/>
      <rect x="146" y="224" width="100" height="90" rx="8" fill="#ffffff" stroke-dasharray="6 4"/>
      <rect x="704" y="124" width="100" height="90" rx="8" fill="#dcfce7"/>
      <rect x="814" y="124" width="100" height="90" rx="8" fill="#dbeafe"/>
      <rect x="704" y="224" width="100" height="90" rx="8" fill="#ffedd5"/>
      <rect x="814" y="224" width="100" height="90" rx="8" fill="#ede9fe"/>
    </g>
    <g text-anchor="middle" font-size="17">
      <text x="86" y="177">Earth</text><text x="196" y="177">Water</text>
      <text x="86" y="277">Empty</text><text x="196" y="277">Empty</text>
      <text x="754" y="177">Earth</text><text x="864" y="177">Water</text>
      <text x="754" y="277">Fire</text><text x="864" y="277">Air</text>
    </g>
    <path d="M270 219 H318 M637 219 H682" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="330" y="125" width="296" height="189" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="478" y="156" text-anchor="middle" font-size="19" font-weight="700">Requested: add 3</text>
    <g font-size="15">
      <text x="350" y="189">1. Choose an available resource.</text>
      <text x="350" y="216">2. Choose an owned empty space.</text>
      <text x="350" y="243">3. Repeat while legal additions fit.</text>
      <text x="350" y="282" font-weight="700">Added 2; skipped 1.</text>
    </g>
    <rect x="30" y="340" width="900" height="60" rx="10" fill="#fef3c7" stroke="#b45309"/>
    <text x="48" y="365" font-size="16" font-weight="700">No overflow, no automatic replacement of existing pieces.</text>
    <text x="48" y="388" font-size="14">Stock exhaustion also limits additions. For removals, choose owned resources until the count or inventory runs out.</text>
  </g>
</svg>
